[project]
name = "ampower_jive"
authors = [
    { name = "Ambibuzz Technologies LLP", email = "buzz.us@ambibuzz.com" }
]
description = "Conversation over AmPower using GenAI"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # add other dependencies below
    "frappe~=15.45.0", 
    "erpnext~=15.39.0",
    "openai~=1.77.0",
    "pymysql~=1.1.1",
    "langchain-community~=0.3.5",
    "langchain_openai~=0.2.8",
    "httpx~=0.27.2",
    "mcp~=1.9.4",
    "pdfminer.six==20221105",
    "google-api-python-client==2.2.0",
    "google-auth==1.29.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

